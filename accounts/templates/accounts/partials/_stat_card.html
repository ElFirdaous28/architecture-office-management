<div class="rounded-xl border border-border bg-surface p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="text-sm font-medium text-text-muted">{{ label }}</p>
            <p class="mt-3 text-3xl font-bold tracking-tight text-primary">
                {{ value|default_if_none:0 }}
            </p>
        </div>

        {% if icon %}
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary">
                <i data-lucide="{{ icon }}" class="h-5 w-5" aria-hidden="true"></i>
            </div>
        {% endif %}
    </div>

    {% if description %}
        <p class="mt-3 text-sm text-text-muted">{{ description }}</p>
    {% endif %}
</div>
