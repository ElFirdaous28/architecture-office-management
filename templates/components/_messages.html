{% if messages %}
    <div class="fixed right-4 top-4 z-50 w-[calc(100%-2rem)] max-w-sm space-y-3 sm:right-6 sm:top-6"
         aria-live="polite">
        {% for message in messages %}
            <div role="status"
                 data-toast
                 class="flex items-start gap-3 rounded-lg border px-4 py-3 text-sm shadow-lg
                 {% if 'error' in message.tags %}
                     border-red-200 bg-red-50 text-red-700
                 {% elif 'success' in message.tags %}
                     border-green-200 bg-green-50 text-green-800
                 {% else %}
                     border-border bg-surface text-neutral
                 {% endif %}">
                {% if 'error' in message.tags %}
                    <i data-lucide="circle-alert" class="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true"></i>
                {% elif 'success' in message.tags %}
                    <i data-lucide="circle-check" class="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true"></i>
                {% else %}
                    <i data-lucide="info" class="mt-0.5 h-5 w-5 shrink-0" aria-hidden="true"></i>
                {% endif %}
                <span class="flex-1">{{ message }}</span>
                <button type="button" data-dismiss-toast
                        class="rounded-md p-1 text-current/60 hover:bg-black/5 hover:text-current"
                        aria-label="Dismiss notification">
                    <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
