
<aside class="flex min-h-screen w-64 shrink-0 flex-col bg-primary text-white">

    <!-- Brand -->
    <div class="border-b border-white/10 px-6 py-6">
        <div class="flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/10">
                <i data-lucide="building-2" class="h-6 w-6" aria-hidden="true"></i>
            </div>

            <div>
                <p class="text-sm font-bold tracking-wide">Architecture</p>
                <p class="text-xs text-white/60">Office Management</p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6">
        <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-white/50">
            Menu
        </p>

        <div class="space-y-2">
            <a href="{% url 'dashboard' %}"
               class="flex items-center gap-3 rounded-lg bg-white/15 px-3 py-3 text-sm font-medium text-white transition hover:bg-white/20">
                <i data-lucide="layout-dashboard"
                   class="h-5 w-5"
                   aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>

            {% if user_role == "Administrator" %}
                <a href="{% url 'user_list' %}"
                   class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium text-white/75 transition hover:bg-white/10 hover:text-white">
                    <i data-lucide="users"
                       class="h-5 w-5"
                       aria-hidden="true"></i>
                    <span>Manage Users</span>
                </a>
            {% endif %}
        </div>
    </nav>

    <!-- User role -->
    <div class="border-t border-white/10 p-4">
        <div class="flex items-center gap-3 rounded-lg bg-white/5 p-3">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10">
                <i data-lucide="shield-check"
                   class="h-5 w-5"
                   aria-hidden="true"></i>
            </div>

            <div class="min-w-0">
                <p class="text-xs text-white/50">Signed in as</p>
                <p class="truncate text-sm font-medium">{{ user_role }}</p>
            </div>
        </div>
    </div>

</aside>
