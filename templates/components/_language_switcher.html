{% load i18n %}
<form method="post" action="{% url 'set_language' %}" class="flex items-center gap-2">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="language-select" class="sr-only">{% translate "Language" %}</label>
    <select id="language-select" name="language" onchange="this.form.submit()"
            class="rounded-lg border border-border bg-surface px-2.5 py-2 text-xs font-bold text-neutral outline-none focus:border-primary focus:ring-2 focus:ring-primary/10"
            aria-label="{% translate 'Language' %}">
        {% get_current_language as current_language %}
        <option value="en" {% if current_language == "en" %}selected{% endif %}>EN</option>
        <option value="fr" {% if current_language == "fr" %}selected{% endif %}>FR</option>
    </select>
</form>
