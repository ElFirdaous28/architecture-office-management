
<aside class="flex w-full shrink-0 flex-col bg-primary text-white md:sticky md:top-0 md:h-screen md:w-64">

    <!-- Brand -->
    <div class="border-b border-white/10 px-5 py-5 md:px-6 md:py-6">
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/10">
                <i data-lucide="building-2" class="h-6 w-6" aria-hidden="true"></i>
            </div>
            <div>
                <p class="text-sm font-bold tracking-wide">Architecture</p>
                <p class="mt-0.5 text-xs text-white/60">Office Management</p>
            </div>
        </a>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-2 px-3 py-5 md:px-4 md:py-6">
        <p class="mb-3 px-3 text-xs font-semibold uppercase tracking-wider text-white/50">
            Menu
        </p>

        {% with current_nav=request.resolver_match.url_name %}

            <a href="{% url 'dashboard' %}"
               {% if current_nav == "dashboard" %}aria-current="page"{% endif %}
               class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium transition
               {% if current_nav == 'dashboard' %}
                   bg-white/15 text-white
               {% else %}
                   text-white/75 hover:bg-white/10 hover:text-white
               {% endif %}">
                <i data-lucide="layout-dashboard" class="h-5 w-5 shrink-0" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>

            <a href="{% url 'client_list' %}"
               {% if current_nav == "client_list" or current_nav == "client_create" or current_nav == "client_update" or current_nav == "client_delete" %}aria-current="page"{% endif %}
               class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium transition
               {% if current_nav == 'client_list' or current_nav == 'client_create' or current_nav == 'client_update' or current_nav == 'client_delete' %}
                   bg-white/15 text-white
               {% else %}
                   text-white/75 hover:bg-white/10 hover:text-white
               {% endif %}">
                <i data-lucide="contact" class="h-5 w-5 shrink-0" aria-hidden="true"></i>
                <span>Clients</span>
            </a>

            <a href="{% url 'project_list' %}"
               {% if current_nav == "project_list" or current_nav == "project_create" or current_nav == "project_update" or current_nav == "project_delete" %}aria-current="page"{% endif %}
               class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium transition
               {% if current_nav == 'project_list' or current_nav == 'project_create' or current_nav == 'project_update' or current_nav == 'project_delete' %}
                   bg-white/15 text-white
               {% else %}
                   text-white/75 hover:bg-white/10 hover:text-white
               {% endif %}">
                <i data-lucide="building-2" class="h-5 w-5 shrink-0" aria-hidden="true"></i>
                <span>Projects</span>
            </a>

            {% if request.user.role == "ADMIN" %}
                <a href="{% url 'user_list' %}"
                   {% if current_nav == "user_list" or current_nav == "user_create" %}aria-current="page"{% endif %}
                   class="flex items-center gap-3 rounded-lg px-3 py-3 text-sm font-medium transition
                   {% if current_nav == 'user_list' or current_nav == 'user_create' %}
                       bg-white/15 text-white
                   {% else %}
                       text-white/75 hover:bg-white/10 hover:text-white
                   {% endif %}">
                    <i data-lucide="users" class="h-5 w-5 shrink-0" aria-hidden="true"></i>
                    <span>Users</span>
                </a>
            {% endif %}

        {% endwith %}
    </nav>

    <!-- Current role -->
    <div class="border-t border-white/10 p-3 md:p-4">
        <div class="flex items-center gap-3 rounded-lg bg-white/5 p-3">
            <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10">
                <i data-lucide="shield-check" class="h-5 w-5" aria-hidden="true"></i>
            </div>
            <div class="min-w-0">
                <p class="text-xs text-white/50">Signed in as</p>
                <p class="truncate text-sm font-medium">{{ request.user.get_role_display }}</p>
            </div>
        </div>
    </div>

</aside>
