{% load i18n %}
<div
    id="deleteModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deleteModalTitle" >
    <div class="w-full max-w-md rounded-xl bg-surface p-6 shadow-xl">
        <div class="mb-4 flex items-center gap-3">
            <div class="rounded-full bg-red-100 p-3 text-red-600">
                <i data-lucide="alert-triangle"></i>
            </div>

            <h2 id="deleteModalTitle" class="text-lg font-semibold">
                {% translate "Confirm deletion" %}
            </h2>
        </div>

        <p class="mb-6 text-sm text-text-muted">
            {% translate "Are you sure you want to delete" %}
            <span id="deleteItemName" class="font-semibold text-neutral"></span>?
            {% translate "This action cannot be undone." %}
        </p>

        <form id="deleteForm" method="post">
            {% csrf_token %}

            <div class="flex justify-end gap-3">
                <button
                    type="button"
                    id="cancelDelete"
                    class="rounded-lg border border-border px-4 py-2 text-sm hover:bg-background" >
                    {% translate "Cancel" %}
                </button>

                <button
                    type="submit"
                    class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700" >
                    {% translate "Delete" %}
                </button>
            </div>
        </form>
    </div>
</div>
